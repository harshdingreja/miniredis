name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Build on a real JDK 21 (our target), whatever newer JDK we use locally.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven # reuses downloaded dependencies (~/.m2) between runs, so CI is faster

      # -B = batch mode: no interactive prompts and no download-progress noise in the logs.
      - name: Build and test
        run: mvn -B verify
